<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Awesome MCP Servers</title>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    :root {
      --bg: #0d1117;
      --surface: #161b22;
      --border: #30363d;
      --text: #e6edf3;
      --muted: #8b949e;
      --accent: #58a6ff;
      --green: #3fb950;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      font-size: 15px;
      line-height: 1.6;
    }
    header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 16px 24px;
      display: flex;
      align-items: center;
      gap: 16px;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    header h1 { font-size: 18px; font-weight: 600; flex: 1; }
    header h1 span { color: var(--accent); }
    #search {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text);
      padding: 6px 12px;
      font-size: 14px;
      width: 280px;
      outline: none;
    }
    #search:focus { border-color: var(--accent); }
    #count {
      color: var(--muted);
      font-size: 13px;
      white-space: nowrap;
    }
    main {
      max-width: 960px;
      margin: 0 auto;
      padding: 32px 24px;
    }
    #content h1 { display: none; }
    #content h2 {
      font-size: 20px;
      font-weight: 600;
      margin: 40px 0 16px;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--border);
      color: var(--text);
    }
    #content h3 {
      font-size: 16px;
      font-weight: 600;
      margin: 24px 0 12px;
      color: var(--accent);
    }
    #content ul {
      list-style: none;
      padding: 0;
    }
    #content ul li {
      padding: 8px 12px;
      border-radius: 6px;
      margin-bottom: 4px;
      border: 1px solid transparent;
      transition: border-color 0.15s, background 0.15s;
    }
    #content ul li:hover {
      background: var(--surface);
      border-color: var(--border);
    }
    #content a {
      color: var(--accent);
      text-decoration: none;
    }
    #content a:hover { text-decoration: underline; }
    #content p { margin-bottom: 12px; color: var(--muted); }
    #content code {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 2px 6px;
      font-size: 13px;
    }
    .hidden { display: none !important; }
    #no-results {
      text-align: center;
      color: var(--muted);
      padding: 60px 0;
      display: none;
    }
    footer {
      text-align: center;
      color: var(--muted);
      font-size: 13px;
      padding: 40px 24px;
      border-top: 1px solid var(--border);
    }
    footer a { color: var(--accent); text-decoration: none; }
  </style>
</head>
<body>
  <header>
    <h1>⚡ <span>Awesome</span> MCP Servers</h1>
    <input id="search" type="search" placeholder="Search 1,300+ servers..." autocomplete="off" />
    <span id="count"></span>
  </header>
  <main>
    <div id="content"></div>
    <div id="no-results">No servers found matching your search.</div>
  </main>
  <footer>
    Curated by <a href="https://github.com/punkpeye/awesome-mcp-servers" target="_blank">punkpeye/awesome-mcp-servers</a> &middot;
    Hosted on <a href="https://railway.app" target="_blank">Railway</a>
  </footer>

  <script>
    async function init() {
      const res = await fetch('README.md');
      const md = await res.text();
      document.getElementById('content').innerHTML = marked.parse(md);

      const items = document.querySelectorAll('#content ul li');
      const countEl = document.getElementById('count');
      countEl.textContent = `${items.length} servers`;

      const search = document.getElementById('search');
      const noResults = document.getElementById('no-results');

      search.addEventListener('input', () => {
        const q = search.value.toLowerCase().trim();
        let visible = 0;
        items.forEach(li => {
          const match = !q || li.textContent.toLowerCase().includes(q);
          li.classList.toggle('hidden', !match);
          if (match) visible++;
        });
        countEl.textContent = q ? `${visible} of ${items.length} servers` : `${items.length} servers`;
        noResults.style.display = visible === 0 && q ? 'block' : 'none';
      });
    }
    init();
  </script>
</body>
</html>
